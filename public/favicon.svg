<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0c1a3e"/>

  <!-- Outer orbital ring -->
  <circle cx="32" cy="32" r="26" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Middle ring -->
  <circle cx="32" cy="32" r="19" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Sweeping arc (gravity well) -->
  <path d="M 32 6 A 26 26 0 0 1 58 32" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <path d="M 32 58 A 26 26 0 0 1 6 32" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>

  <!-- Inner arc opposite -->
  <path d="M 13 32 A 19 19 0 0 1 32 13" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M 51 32 A 19 19 0 0 1 32 51" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Center glow dot -->
  <circle cx="32" cy="32" r="5" fill="#3b82f6"/>
  <circle cx="32" cy="32" r="3" fill="#93c5fd"/>
</svg>
